 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smart Cargo - نظام لوجستي متكامل</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [view, setView] = useState('login'); 
            const [role, setRole] = useState(''); // shipper, trader, importer, big-trader
            const [shipments, setShipments] = useState([]);

            const handleLogin = (selectedRole) => {
                setRole(selectedRole);
                setView('dashboard');
            };

            // لوحة التحكم الرئيسية
            const Dashboard = () => (
                <div class="space-y-6 p-4">
                    <div class="bg-gradient-to-r from-blue-800 to-indigo-900 text-white p-6 rounded-3xl shadow-lg">
                        <h2 class="text-2xl font-bold">مرحباً بك في Smart Cargo</h2>
                        <p class="text-blue-200">صلاحية: {role}</p>
                    </div>

                    {/* إحصائيات النظام */}
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                            <p class="text-slate-500 text-xs">إجمالي الشحنات</p>
                            <h3 class="text-2xl font-bold text-blue-900">1,240</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                            <p class="text-slate-500 text-xs">{role === 'shipper' ? 'عدد المناديب' : 'شحناتي النشطة'}</p>
                            <h3 class="text-2xl font-bold text-green-600">45</h3>
                        </div>
                    </div>

                    {/* الأزرار الرئيسية */}
                    <div class="space-y-3">
                        <button onClick={() => setView('add-shipment')} class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg">إنشاء طلب شحن جديد</button>
                        <button class="w-full py-4 bg-white text-blue-900 border-2 border-blue-600 rounded-2xl font-bold">تتبع الشحنات بالخريطة</button>
                    </div>
                </div>
            );

            // نموذج طلب الشحن التفصيلي
            const AddShipment = () => (
                <div class="p-4 space-y-4">
                    <h2 class="text-xl font-bold">بيانات الشحنة المتكاملة</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <input placeholder="اسم الراسل" class="p-3 border rounded-xl" />
                        <input placeholder="رقم هاتف الراسل" class="p-3 border rounded-xl" />
                        <input placeholder="اسم المرسل إليه" class="p-3 border rounded-xl" />
                        <input placeholder="رقم المرسل إليه" class="p-3 border rounded-xl" />
                    </div>
                    <select class="w-full p-3 border rounded-xl"><option>اختر المحافظة / الوجهة</option></select>
                    <div class="grid grid-cols-2 gap-3">
                        <input placeholder="نوع البضاعة" class="p-3 border rounded-xl" />
                        <input placeholder="حالة الكرتونة" class="p-3 border rounded-xl" />
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <input placeholder="الطول" class="p-3 border rounded-xl" />
                        <input placeholder="العرض" class="p-3 border rounded-xl" />
                        <input placeholder="الارتفاع" class="p-3 border rounded-xl" />
                    </div>
                    <button onClick={() => setView('dashboard')} class="w-full py-4 bg-green-600 text-white rounded-2xl font-bold">تأكيد إرسال الطلب</button>
                </div>
            );

            return (
                <div class="max-w-md mx-auto">
                    {view === 'login' && (
                        <div class="p-6 mt-10">
                            <h1 class="text-3xl font-black text-center mb-10 text-blue-900">Smart Cargo</h1>
                            <div class="space-y-3">
                                <button onClick={() => handleLogin('shipper')} class="w-full p-4 bg-blue-900 text-white rounded-2xl">شركة شحن</button>
                                <button onClick={() => handleLogin('trader')} class="w-full p-4 bg-blue-600 text-white rounded-2xl">تاجر / تاجر جملة</button>
                                <button onClick={() => handleLogin('importer')} class="w-full p-4 bg-indigo-600 text-white rounded-2xl">مستورد</button>
                            </div>
                        </div>
                    )}
                    {view === 'dashboard' && <Dashboard />}
                    {view === 'add-shipment' && <AddShipment />}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
